<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Sistema SST</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top, #2d3748 0%, #1a202c 50%, #0f141e 100%);
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: min(1000px, 100%);
            text-align: center;
        }

        .title {
            font-size: clamp(28px, 4vw, 44px);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a0aec0;
            font-size: clamp(14px, 2vw, 18px);
            margin-bottom: 36px;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(260px, 1fr));
            gap: 20px;
        }

        .menu-button {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            border-radius: 16px;
            min-height: 230px;
            padding: 24px;
            border: 2px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            color: #f7fafc;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .menu-button:hover {
            transform: translateY(-4px);
            border-color: #90cdf4;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        }

        .menu-button:focus-visible {
            outline: 3px solid #63b3ed;
            outline-offset: 3px;
        }

        .menu-button.tests {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
        }

        .menu-button.migration {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
        }

        .button-title {
            font-size: clamp(22px, 3vw, 32px);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .button-text {
            font-size: clamp(13px, 1.5vw, 16px);
            color: #e2e8f0;
            opacity: 0.95;
        }

        @media (max-width: 760px) {
            .buttons-grid {
                grid-template-columns: 1fr;
            }

            .menu-button {
                min-height: 190px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1 class="title">API SST</h1>
        <p class="subtitle">Selecione a área que deseja acessar</p>

        <div class="buttons-grid">
            <a class="menu-button tests" href="testes.html">
                <span class="button-title">Página de Testes</span>
                <span class="button-text">Executar e acompanhar testes automatizados da API</span>
            </a>

            <a class="menu-button migration" href="migracao.html">
                <span class="button-title">Página de Migração</span>
                <span class="button-text">Copiar registros da origem e criar no destino via POST</span>
            </a>
        </div>
    </main>
</body>
</html>
